<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inquiry - NamelessGirls</title>
  
  <!-- Strict Crawler Exclusion -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css?v=6.0">
</head>
<body>

  <!-- Navigation Header (Always scrolled state style) -->
  <header class="scrolled">
    <div class="container navbar">
      <a href="index.html" class="logo">NAMELESS<span>GIRLS</span></a>
      <ul class="nav-links">
        <li><a href="index.html" onclick="if(document.referrer.indexOf(window.location.host)!==-1){history.back(); return false;}">Back</a></li>
      </ul>
    </div>
  </header>

  <!-- Contact Form Container -->
  <div class="container contact-container">
    <h2 class="section-title">Inquiry<span>出演依頼・お問い合わせ</span></h2>
    <p class="contact-intro">
      モデルへのPR案件・広告出演、画像や映像のライセンス利用、コラボレーション企画など、<br>
      お仕事に関するお問い合わせを承っております。以下の項目をご入力の上、送信してください。
    </p>
    
    <form class="contact-form" id="inquiry-form">
      <div class="form-group">
        <label class="form-label">ご依頼内容</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="request_type" value="広告・PRプロモーション" class="radio-input" checked> 広告・PR案件
          </label>
          <label class="radio-label">
            <input type="radio" name="request_type" value="画像・映像ライセンス使用" class="radio-input"> ライセンス使用
          </label>
          <label class="radio-label">
            <input type="radio" name="request_type" value="コラボレーション/その他" class="radio-input"> コラボ・その他
          </label>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="contact-name">お名前<span>※</span></label>
        <div class="form-control-wrap">
          <input type="text" id="contact-name" name="name" class="form-input" placeholder="例: 山田 太郎" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="contact-company">会社名</label>
        <div class="form-control-wrap">
          <input type="text" id="contact-company" name="company" class="form-input" placeholder="例: 株式会社〇〇（個人の場合は『個人』とご記入ください）">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="contact-email">Eメール<span>※</span></label>
        <div class="form-control-wrap">
          <input type="email" id="contact-email" name="email" class="form-input" placeholder="例: info@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="contact-tel">電話番号<span>※</span></label>
        <div class="form-control-wrap">
          <input type="tel" id="contact-tel" name="tel" class="form-input" placeholder="例: 09012345678" required>
        </div>
      </div>

      <div class="form-group align-top">
        <label class="form-label" for="contact-message">メッセージ</label>
        <div class="form-control-wrap">
          <textarea id="contact-message" name="message" class="form-input form-textarea" placeholder="ご希望のモデル（例: Mii）、ご予算、使用媒体、掲載開始希望日など、ご用件の詳細を差し支えのない範囲でご記入ください。"></textarea>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">企画書・資料の添付</label>
        <div class="form-control-wrap">
          <div class="file-upload-wrap">
            <label for="contact-file" class="file-label-btn"><i class="fas fa-paperclip"></i> ファイルの選択</label>
            <input type="file" id="contact-file" name="attachment" class="file-input">
            <span class="file-name-text" id="file-name">資料が選択されていません</span>
          </div>
        </div>
      </div>

      <div class="form-submit-wrap">
        <button type="submit" class="btn btn-primary btn-submit">上記の内容でお問い合わせ</button>
      </div>
    </form>
  </div>

  <!-- Footer -->
  <footer>
    <div class="container">
      <div class="footer-bottom">
        <div>&copy; 2026 NamelessGirls. All Rights Reserved.</div>
      </div>
    </div>
  </footer>

  <!-- Contact JS handler (Shares the app.js handler) -->
  <script src="app.js?v=6.0"></script>
</body>
</html>
